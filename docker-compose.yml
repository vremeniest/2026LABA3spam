version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: spam_postgres
    environment:
      POSTGRES_DB: spam_db
      POSTGRES_USER: spam_user
      POSTGRES_PASSWORD: spam_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - spam_network
    restart: unless-stopped

  vault:
    image: hashicorp/vault:latest
    container_name: spam_vault
    ports:
      - "8200:8200"
    environment:
      VAULT_ADDR: http://0.0.0.0:8200
      VAULT_DEV_ROOT_TOKEN_ID: root
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    cap_add:
      - IPC_LOCK
    networks:
      - spam_network
    restart: unless-stopped
    command: |
      sh -c "vault server -dev -dev-root-token-id=root &
             sleep 5 &&
             vault secrets enable -path=secret kv-v2 &&
             vault kv put secret/postgres password='spam_password' &&
             tail -f /dev/null"

  ml-api:
    build: .
    container_name: spam_api
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - vault
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: spam_db
      DB_USER: spam_user

      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: root
    volumes:
      - ./models:/app/models
    networks:
      - spam_network
    restart: unless-stopped
    command: uvicorn src.api:app --host 0.0.0.0 --port 8000 --reload

networks:
  spam_network:

volumes:
  postgres_data: